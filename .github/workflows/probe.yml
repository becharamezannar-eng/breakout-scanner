name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: probe
        run: |
          python - <<'PY'
          import yfinance as yf, requests, traceback, json
          print("yfinance", yf.__version__)
          for t in ["NOC","CTC-A.TO"]:
              try:
                  i = yf.Ticker(t).get_info(); print(t, "info:", i.get("longName"), i.get("industry"), (i.get("longBusinessSummary") or "")[:80])
              except Exception as e: print(t, "info ERR", repr(e)[:300])
              try: print(t, "calendar:", yf.Ticker(t).calendar)
              except Exception as e: print(t, "cal ERR", repr(e)[:300])
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept":"application/json"}
          for u in ["https://query2.finance.yahoo.com/v1/finance/search?q=NOC&quotesCount=1",
                    "https://api.nasdaq.com/api/screener/stocks?tableonly=true&limit=3&download=true",
                    "https://api.nasdaq.com/api/company/NOC/company-profile",
                    "https://en.wikipedia.org/api/rest_v1/page/summary/Northrop_Grumman",
                    "https://www.tsx.com/json/company-directory/search/tsx/CTC"]:
              try:
                  r=requests.get(u,headers=H,timeout=20); print(u, r.status_code, r.text[:400].replace("\n"," "))
              except Exception as e: print(u,"ERR",repr(e)[:200])
          PY
