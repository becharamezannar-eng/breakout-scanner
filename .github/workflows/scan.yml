name: Daily breakout scan

on:
  schedule:
    # Evening scan: weekdays 22:00 UTC = 6 pm ET (summer) / 5 pm ET (winter), after the close.
    - cron: "0 22 * * 1-5"
    # Morning check: 14:15 and 15:15 UTC. The script only works between 9:50 am and 12:45 pm ET
    # (GitHub often starts these ~30 min late), so in summer it runs ~10:15 and ~11:15 ET,
    # in winter ~10:15 ET. Its verdicts are also shown at the top of the main report.
    - cron: "15 14 * * 1-5"
    - cron: "15 15 * * 1-5"
    # Backtest: Saturdays 12:00 UTC.
    # (Schedule re-registered 2026-10-19 after scheduled runs stopped firing; no change to times.)
    - cron: "0 12 * * 6"
  workflow_dispatch:      # start any mode by hand from the Actions tab
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [scan, morning, backtest, lookup]
        default: scan
      ticker:
        description: "Ticker for a lookup (e.g. SHOP.TO, NVDA)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: breakout-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 6" ]; then m=backtest
          elif [ "${{ github.event.schedule }}" = "0 22 * * 1-5" ]; then m=scan
          else m=morning; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "Mode: $m"

      - name: Self-test
        run: python breakout_scanner.py --selftest

      - name: Evening scan (all six indexes)
        if: steps.mode.outputs.mode == 'scan'
        run: python breakout_scanner.py --outdir reports ${{ github.event_name == 'workflow_dispatch' && '--auto' || '' }}

      - name: Morning check
        if: steps.mode.outputs.mode == 'morning'
        env:
          FORCE_MORNING: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python breakout_scanner.py --outdir reports --morning

      - name: Ticker lookup
        if: steps.mode.outputs.mode == 'lookup'
        env:
          TICKER: ${{ inputs.ticker }}
        run: python lookup.py --outdir reports

      - name: Backtest (5 years, S&P 500 + TSX 60 + Dow)
        if: steps.mode.outputs.mode == 'backtest'
        run: python breakout_scanner.py --outdir reports --backtest

      - name: Build report site
        run: |
          mkdir -p site
          latest=$(ls reports/breakouts_*.html | sort | tail -1)
          cp "$latest" site/index.html
          cp reports/*.html reports/*.csv site/
          if [ -d reports/lookup ]; then cp -r reports/lookup site/; fi
          {
            echo '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>Scan archive</title><body style="font-family:sans-serif;margin:16px"><h1>Past scans</h1><ul>'
            for f in $(ls -r reports/breakouts_*.html); do n=$(basename "$f"); echo "<li><a href=\"$n\">${n%.html}</a></li>"; done
            echo '</ul><p><a href="index.html">Latest scan</a></p></body>'
          } > site/archive.html

      - name: Save report to the repository
        run: |
          git config user.name "breakout-bot"
          git config user.email "breakout-bot@users.noreply.github.com"
          git add reports
          git commit -m "${{ steps.mode.outputs.mode }} ${{ inputs.ticker }} $(date -u +%F)" || echo "Nothing new to commit"
          # if another run saved reports meanwhile, keep this run's newer files (-X theirs = the commit being replayed)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
