# GDELT (free, no key): finds articles from outlets without public RSS (Reuters, AP, BNN Bloomberg...).
# One query per line; results are filtered to the allowed domains below. GDELT allows ~1 request / 5 seconds.
gdelt:
  domains: [reuters.com, apnews.com, bnnbloomberg.ca, cbc.ca, ctvnews.ca, globalnews.ca, financialpost.com,
            cnbc.com, bbc.com, bbc.co.uk, thenationalnews.com, gulfnews.com, khaleejtimes.com, aljazeera.com,
            marketwatch.com, theglobeandmail.com, lapresse.ca, ici.radio-canada.ca]
  queries:
    - {q: "(domain:reuters.com OR domain:apnews.com) (Canada OR Canadian OR Ottawa)", sections: [canada]}
    - {q: "(domain:reuters.com OR domain:apnews.com) (Quebec OR Montreal OR Ontario OR Toronto)", sections: [quebec, ontario]}
    - {q: "(domain:reuters.com OR domain:apnews.com) (\"Federal Reserve\" OR inflation OR \"interest rates\" OR GDP OR economy)", sections: [global_economy, united_states]}
    - {q: "(domain:reuters.com OR domain:apnews.com) (stocks OR bonds OR oil OR gold OR dollar OR markets)", sections: [financial_markets]}
    - {q: "(domain:reuters.com OR domain:apnews.com) (Dubai OR UAE OR \"Abu Dhabi\" OR Saudi OR Gulf OR Israel OR Iran)", sections: [middle_east]}
    - {q: "(domain:reuters.com OR domain:apnews.com) (sanctions OR election OR summit OR war OR tariffs OR diplomacy)", sections: [geopolitics]}
    - {q: "(domain:reuters.com OR domain:apnews.com) (\"artificial intelligence\" OR AI OR chips OR cybersecurity)", sections: [ai_technology]}
    - {q: "(domain:reuters.com OR domain:apnews.com) (bank OR banks OR ETF OR \"asset manager\" OR wealth OR pension)", sections: [wealth]}
    - {q: "domain:bnnbloomberg.ca", sections: [financial_markets, canada]}
    - {q: "(domain:ctvnews.ca OR domain:globalnews.ca) (economy OR housing OR bank OR business)", sections: [canada]}
