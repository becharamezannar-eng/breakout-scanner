# Source registry for the Global Intelligence & Wealth Brief.
#
# tier:    1 = wire service / central bank / official statistics, 2 = major news organisation, 3 = specialist trade press
# paywall: none  = free;  check = metered or partly paywalled, every article is checked and dropped if locked
# sections: where its stories go first (keyword routing adds more)
# Each feed is checked by `python -m intel probe`; feeds that fail are skipped automatically and reported.
#
# Domains that are always excluded (hard paywalls or opinion-led): see BLOCKED_DOMAINS in verify.py.

