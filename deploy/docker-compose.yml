# Global Intelligence & Wealth Brief - server stack (run from the repository root):
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Nothing is exposed to the internet: the bot uses outbound long polling, the database and Redis are on a
# private Docker network, and the health endpoint is only reachable inside the container.

name: intel

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  intel:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://intel:${POSTGRES_PASSWORD}@db:5432/intel
      REDIS_URL: redis://redis:6379/0
    volumes: [intel_data:/data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intel
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel -d intel"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m

volumes:
  intel_data:
  pg_data:
  redis_data:
